[workspace]
members = [
    "crates/hanabi-cli",
    "crates/hanabi-core",
    "crates/hanabi-protocol",
    "crates/hanabi-search",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
dead_code = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
