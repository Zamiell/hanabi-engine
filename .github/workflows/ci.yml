name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust with lint tools
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install formatting dependencies
        run: npm ci --ignore-scripts

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143

      - name: Install Python development dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement scripts/requirements-dev.txt

      - name: Install Hawk toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install cargo-hawk 0.1.10
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/hawk/releases/download/0.1.10/cargo-hawk-installer.sh \
            | sh

      - name: Build, test, and lint
        run: scripts/check.sh

  exhaustive-h-group-profiles:
    name: Exhaustive H-Group profile matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test every cumulative H-Group profile
        run: scripts/check-exhaustive.sh
